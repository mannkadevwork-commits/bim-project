name: Windows Mono-Repo CI/CD

on:
  push:
    branches:
      - main  # Triggers whenever you push changes to the 'main' branch

jobs:
  deploy:
    runs-on: self-hosted  # Tells GitHub to use the Windows runner on your server
    steps:
      
      - name: 1. Pull Latest Code (Force Reset)
        shell: powershell
        run: |
          cd C:\Projects\bim-project
          git fetch --all
          git reset --hard origin/main

      - name: 2. Deploy React Frontend
        shell: powershell
        run: |
          cd C:\Projects\bim-project\xeo-kit-project\bim-viewer-app
          npm install
          npm run build
          pm2 restart bim-frontend

      - name: 3. Deploy Node Backend
        shell: powershell
        run: |
          cd C:\Projects\bim-project\xeo-kit-project\ifc-render-app
          npm install
          pm2 restart bim-backend

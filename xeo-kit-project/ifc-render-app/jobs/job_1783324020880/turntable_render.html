<!DOCTYPE html>
            <html>
            <head>
                <title>3D Interactive Turntable</title>
                <style>
                    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; user-select: none; }
                    img { max-width: 100%; max-height: 100vh; object-fit: contain; cursor: ew-resize; }
                    #instructions { position: absolute; bottom: 30px; text-align: center; width: 100%; pointer-events: none; font-size: 18px; text-shadow: 0px 2px 4px rgba(0,0,0,0.8); }
                </style>
            </head>
            <body>
                <img id="viewer" src="orbit_0000.png" draggable="false" />
                <div id="instructions">↔️ Click and Drag to Rotate 3D Floor Plan</div>
                <script>
                    const totalFrames = 12;
                    const img = document.getElementById('viewer');
                    let currentFrame = 0;
                    let isDragging = false;
                    let startX = 0;

                    // Preload all 12 High-Res frames
                    const images = [];
                    for (let i = 0; i < totalFrames; i++) {
                        images[i] = new Image();
                        // Format: orbit_0000.jpg, orbit_0001.jpg, etc.
                        images[i].src = 'orbit_' + String(i).padStart(4, '0') + '.png'; 
                    }

                    img.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
                    window.addEventListener('mouseup', () => { isDragging = false; });
                    window.addEventListener('mousemove', (e) => {
                        if (!isDragging) return;
                        const dx = e.clientX - startX;
                        // Adjust the '15' below to make spinning faster or slower
                        if (Math.abs(dx) > 15) { 
                            if (dx > 0) currentFrame = (currentFrame + 1) % totalFrames;
                            else currentFrame = (currentFrame - 1 + totalFrames) % totalFrames;
                            img.src = images[currentFrame].src;
                            startX = e.clientX;
                        }
                    });
                </script>
            </body>
            </html>

name: HCI 2.1 Training Module CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'hci-3d-model-main/HCI_2.1/**'
      - 'hci-3d-model-main/ops/hci-training-deploy.sh'
      - '.github/workflows/training-deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hci-training-production
  cancel-in-progress: false

jobs:
  verify:
    name: Validate and package HCI 2.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate Python syntax and required files
        shell: bash
        run: |
          set -euo pipefail
          APP='hci-3d-model-main/HCI_2.1'
          test -f "$APP/web/server.py"
          test -f "$APP/web/index.html"
          test -f "$APP/requirements.txt"
          test -f "$APP/logic/production_orchestrator.py"
          python -m compileall -q "$APP"

      - name: Build source-only deployment archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hci-training-bundle"
          tar -czf "$RUNNER_TEMP/hci-training-bundle/HCI_2.1-source.tar.gz" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pt' \
            --exclude='*.pth' \
            --exclude='gdrive_dataset' \
            --exclude='runs' \
            --exclude='iterations' \
            --exclude='hci_datasets' \
            -C hci-3d-model-main HCI_2.1

          archive="$RUNNER_TEMP/hci-training-bundle/HCI_2.1-source.tar.gz"
          listing="$RUNNER_TEMP/hci-training-archive-list.txt"
          tar -tzf "$archive" > "$listing"
          grep -qx 'HCI_2.1/web/server.py' "$listing"
          grep -qx 'HCI_2.1/requirements.txt' "$listing"

          if grep -Eq '(^|/)(gdrive_dataset|runs|iterations|hci_datasets)(/|$)|(^|/)\.env($|\.)|\.pt$|\.pth$' "$listing"; then
            echo '::error::Runtime data, environment files, or model weights found in training archive.'
            exit 1
          fi

      - name: Upload training deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: hci-training-source
          path: ${{ runner.temp }}/hci-training-bundle/HCI_2.1-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy HCI 2.1 to Ubuntu production
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download the verified training artifact
        uses: actions/download-artifact@v8
        with:
          name: hci-training-source
          path: ${{ runner.temp }}/hci-training-bundle

      - name: Configure verified SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret $name is not configured."
              exit 1
            fi
          done
          if [[ "$DEPLOY_USER" != 'hci-deploy' ]]; then
            echo '::error::DEPLOY_USER must be hci-deploy.'
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/hci_deploy_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hci_deploy_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/hci_deploy_ed25519" >/dev/null

      - name: Transfer training artifact
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          SSH=(ssh -i "$HOME/.ssh/hci_deploy_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/hci_deploy_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '/home/hci-deploy/training-incoming/$SHA' && chmod 700 '/home/hci-deploy/training-incoming/$SHA'"
          "${SCP[@]}" "$RUNNER_TEMP/hci-training-bundle/HCI_2.1-source.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/home/hci-deploy/training-incoming/$SHA/"

      - name: Deploy, restart, and health-check training service
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hci_deploy_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/hci-training-deploy.sh '${{ github.sha }}'"

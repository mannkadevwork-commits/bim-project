name: HCI 3D BIM Viewer CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hci-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://103.212.137.8' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            xeo-kit-project/bim-viewer-app/package-lock.json
            xeo-kit-project/ifc-render-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: xeo-kit-project/bim-viewer-app
        run: npm ci

      - name: Build frontend
        working-directory: xeo-kit-project/bim-viewer-app
        run: npm run build

      - name: Install backend dependencies
        working-directory: xeo-kit-project/ifc-render-app
        run: npm ci --include=dev

      - name: Validate backend JavaScript syntax
        shell: bash
        working-directory: xeo-kit-project/ifc-render-app
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

      - name: Verify deployment migration is present
        run: test -f xeo-kit-project/ifc-render-app/migrations/20261022_upgrade_material_assets.sql

      - name: Assemble deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hci-deploy-bundle"

          # The archive deliberately omits all runtime/user data. The server-side
          # deploy script also protects these paths during synchronization.
          tar -czf "$RUNNER_TEMP/hci-deploy-bundle/backend-source.tar.gz" \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='assets' \
            --exclude='uploads' \
            --exclude='jobs' \
            --exclude='material-library.json' \
            --exclude='hci_catalog_db.dump' \
            --exclude='*.log' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -C xeo-kit-project/ifc-render-app .

          tar -czf "$RUNNER_TEMP/hci-deploy-bundle/frontend-dist.tar.gz" \
            -C xeo-kit-project/bim-viewer-app/dist .

      - name: Upload tested deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: hci-deploy-bundle
          path: ${{ runner.temp }}/hci-deploy-bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Ubuntu production
    runs-on: ubuntu-latest
    needs: verify
    # Never deploy pull requests or non-main branches.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download the exact bundle that passed verification
        uses: actions/download-artifact@v8
        with:
          name: hci-deploy-bundle
          path: ${{ runner.temp }}/hci-deploy-bundle

      - name: Configure verified SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret $name is not configured."
              exit 1
            fi
          done
          if [[ "$DEPLOY_USER" != "hci-deploy" ]]; then
            echo "::error::DEPLOY_USER must be hci-deploy for the restricted server deploy script."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/hci_deploy_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hci_deploy_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/hci_deploy_ed25519" >/dev/null

      - name: Transfer deployment bundle
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          SSH=(ssh -i "$HOME/.ssh/hci_deploy_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/hci_deploy_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '/home/hci-deploy/incoming/$SHA' && chmod 700 '/home/hci-deploy/incoming/$SHA'"
          "${SCP[@]}" "$RUNNER_TEMP/hci-deploy-bundle/backend-source.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/home/hci-deploy/incoming/$SHA/"
          "${SCP[@]}" "$RUNNER_TEMP/hci-deploy-bundle/frontend-dist.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/home/hci-deploy/incoming/$SHA/"

      - name: Deploy, migrate, restart, and health-check
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hci_deploy_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/hci-deploy.sh '${{ github.sha }}'"

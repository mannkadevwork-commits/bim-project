<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>HC Interior - Presentation Viewer</title>
            <style>
                body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; display: flex; height: 100vh; overflow: hidden; }
                #sidebar { width: 250px; background-color: #2a2a2a; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); z-index: 10; }
                #sidebar h2 { font-size: 1.2rem; color: #4CAF50; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
                .menu-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #333; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; text-align: left; transition: all 0.2s; }
                .menu-btn:hover { background-color: #4CAF50; border-color: #4CAF50; }
                .menu-btn.active { background-color: #4CAF50; border-color: #4CAF50; font-weight: bold; }
                #viewer-container { flex-grow: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
                iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; display: none; }
                img.static-view { max-width: 100%; max-height: 100vh; object-fit: contain; position: absolute; display: none; }
                .active-view { display: block !important; }
                .missing-notice { display: none; text-align: center; color: #888; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; }
            </style>
        </head>
        <body>
            <div id="sidebar">
                <h2>HC Interior Viewer</h2>
                <button class="menu-btn active" onclick="switchView('top-down', this)">🗺️ Top-Down Plan</button>
                <button class="menu-btn " onclick="switchView('pano-360', this)">🌐 360 Walkthrough</button>
                <button class="menu-btn " onclick="switchView('turntable', this)">🔄 3D Turntable</button>
            </div>
            
            <div id="viewer-container">
                <img id="top-down" class="static-view active-view" src="top_down_plan.png?v=1783329871286" onerror="showMissing(this)" />
                
                <iframe id="pano-360" class="" src="pano_render.html?v=1783329871286" onerror="showMissing(this)"></iframe>
                
                <iframe id="turntable" class="" src="turntable_render.html?v=1783329871286" onerror="showMissing(this)"></iframe>
                
                <div id="missing-notice" class="missing-notice">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <p style="margin-top: 15px;">This angle hasn't been rendered yet.<br>Trigger it from the editor!</p>
                </div>
            </div>

            <script>
                function switchView(viewId, btnElement) {
                    // Update buttons
                    document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
                    btnElement.classList.add('active');
                    
                    // Hide all views and notices
                    document.querySelectorAll('iframe, img.static-view').forEach(el => el.classList.remove('active-view'));
                    document.getElementById('missing-notice').style.display = 'none';
                    
                    // Show selected view
                    const targetView = document.getElementById(viewId);
                    targetView.classList.add('active-view');
                    
                    // Basic check to see if iframe/image actually loaded
                    if(targetView.tagName === 'IMG' && (!targetView.complete || targetView.naturalWidth === 0)) {
                        targetView.classList.remove('active-view');
                        document.getElementById('missing-notice').style.display = 'flex';
                    }
                }
                
                function showMissing(el) {
                    el.classList.remove('active-view');
                    document.getElementById('missing-notice').style.display = 'flex';
                }
            </script>
        </body>
        </html>
